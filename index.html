<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>HSE Welcome System — KARTAŞ KİMYA</title>
  <script src="https://www.google.com/recaptcha/api.js?render=6LckpeUtAAAAAGFdoh8QtC5r9aJZHG9qSscasAk4"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6366f1;
      --success: #22c55e;
      --danger: #ef4444;
      --text: #1e293b;
      --text-secondary: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(180deg, #e0e7ff 0%, #f3e8ff 40%, #e0e7ff 100%);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 0;
    }
    .app-wrapper { width: 100%; max-width: 540px; position: relative; }
    .screen { display: none; width: 100%; min-height: 100vh; }
    .screen.active { display: block; animation: fadeIn 0.5s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    #screenLang { display: none; padding: 12px; justify-content: center; align-items: center; min-height: 100vh; }
    #screenLang.active { display: flex; }
    .flag-list { display: flex; flex-direction: column; gap: 12px; width: 100%; }
    .flag-item {
      width: 100%; height: 24vh; min-height: 120px; max-height: 180px; border-radius: 24px; overflow: hidden; cursor: pointer; position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1), 0 2px 8px rgba(0,0,0,0.04), inset 0 1px 0 rgba(255,255,255,0.3);
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); animation: slideUp 0.7s ease backwards; border: 1px solid rgba(255,255,255,0.25);
    }
    .flag-item:nth-child(1) { animation-delay: 0.08s; }
    .flag-item:nth-child(2) { animation-delay: 0.18s; }
    .flag-item:nth-child(3) { animation-delay: 0.28s; }
    .flag-item:nth-child(4) { animation-delay: 0.38s; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(50px) scale(0.92); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .flag-item:hover, .flag-item:active { transform: translateY(-6px) scale(1.03); box-shadow: 0 20px 50px rgba(0,0,0,0.18), 0 4px 12px rgba(0,0,0,0.08), inset 0 1px 0 rgba(255,255,255,0.4); }
    .flag-item img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.6s ease; pointer-events: none; }
    .flag-item:hover img { transform: scale(1.1); }
    .soft-card { background: rgba(255,255,255,0.96); border-radius: 28px; box-shadow: 0 24px 64px rgba(0,0,0,0.08), 0 0 0 1px rgba(255,255,255,0.6) inset; margin: 16px; overflow: hidden; backdrop-filter: blur(10px); }
    .form-hero { text-align: center; padding: 52px 28px 40px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; position: relative; overflow: hidden; }
    .form-hero::after { content: ''; position: absolute; top: -50%; right: -30%; width: 300px; height: 300px; background: radial-gradient(circle, rgba(255,255,255,0.15), transparent 70%); pointer-events: none; }
    .form-hero h1 { font-size: 26px; font-weight: 800; position: relative; z-index: 1; }
    .form-hero p { font-size: 15px; opacity: 0.9; margin-top: 8px; position: relative; z-index: 1; font-weight: 500; }
    .form-body { padding: 28px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 12px; font-weight: 700; color: var(--text-secondary); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.8px; }
    input[type="text"] { width: 100%; padding: 14px 16px; border: 2px solid #e2e8f0; border-radius: 14px; font-size: 16px; font-family: inherit; background: #f8fafc; transition: all 0.2s; color: var(--text); }
    input[type="text"]:focus { outline: none; border-color: #a5b4fc; background: #fff; box-shadow: 0 0 0 4px rgba(99,102,241,0.1); }
    input.error { border-color: #fca5a5; background: #fef2f2; }
    .error-msg { color: var(--danger); font-size: 12px; margin-top: 6px; display: none; font-weight: 500; padding-left: 4px; }
    .error-msg.visible { display: block; }
    .btn { width: 100%; padding: 16px; border: none; border-radius: 16px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.25s; font-family: inherit; letter-spacing: 0.3px; }
    .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; box-shadow: 0 8px 24px rgba(102,126,234,0.35); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(102,126,234,0.45); }
    .btn-primary:disabled { background: #cbd5e1; color: #94a3b8; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-success { background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); color: #fff; box-shadow: 0 8px 24px rgba(34,197,94,0.3); }
    .btn-success:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(34,197,94,0.4); }
    .back-link { display: block; text-align: center; margin-top: 18px; color: var(--text-secondary); font-size: 14px; text-decoration: none; cursor: pointer; font-weight: 500; transition: color 0.2s; }
    .back-link:hover { color: var(--primary); }
    .hse-header { text-align: center; padding: 40px 28px 28px; }
    .hse-header h1 { font-size: 22px; font-weight: 800; color: var(--text); }
    .hse-header p { font-size: 14px; color: var(--text-secondary); margin-top: 6px; font-weight: 500; }
    .hse-body { padding: 0 24px 24px; }
    .hse-img-card { border-radius: 20px; overflow: hidden; margin-bottom: 16px; box-shadow: 0 12px 32px rgba(0,0,0,0.12); background: #fff; position: relative; transition: transform 0.3s ease; border: 1px solid #e2e8f0; }
    .hse-img-card:hover { transform: translateY(-3px); }
    .hse-img-card img { width: 100%; display: block; height: auto; }
    .hse-step-badge { position: absolute; top: 12px; left: 12px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; font-size: 13px; font-weight: 800; padding: 6px 14px; border-radius: 12px; z-index: 10; }
    .hse-img-error { padding: 40px 20px; text-align: center; color: var(--text-secondary); font-size: 14px; background: #f8fafc; }
    .checkbox-wrap { display: flex; align-items: flex-start; gap: 12px; margin: 20px 24px 24px; padding: 18px; background: linear-gradient(135deg, #e0e7ff 0%, #c7d2fe 100%); border-radius: 16px; border: 1px solid #a5b4fc; }
    .checkbox-wrap input[type="checkbox"] { width: 22px; height: 22px; margin-top: 2px; accent-color: #6366f1; cursor: pointer; flex-shrink: 0; }
    .checkbox-wrap label { font-size: 14px; font-weight: 600; color: #3730a3; text-transform: none; letter-spacing: 0; margin: 0; cursor: pointer; line-height: 1.5; }
    .hse-footer { padding: 0 24px 28px; }
    .success-wrap { text-align: center; padding: 56px 32px 40px; }
    .success-ring { width: 90px; height: 90px; background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; animation: scaleIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
    @keyframes scaleIn { from { transform: scale(0); } to { transform: scale(1); } }
    .success-ring svg { width: 44px; height: 44px; }
    .success-title { font-size: 24px; font-weight: 800; margin-bottom: 10px; color: var(--text); }
    .success-text { color: var(--text-secondary); font-size: 15px; line-height: 1.7; margin-bottom: 32px; font-weight: 500; }
    .success-footer { padding: 0 28px 32px; }
    .spinner-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.9); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 9999; }
    .spinner-overlay.active { display: flex; }
    .spinner { width: 52px; height: 52px; border: 4px solid #e2e8f0; border-top-color: #6366f1; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner-text { margin-top: 18px; color: var(--text-secondary); font-size: 15px; font-weight: 600; }
    @media (max-width: 400px) { .flag-item { height: 22vh; min-height: 100px; border-radius: 20px; } .form-hero { padding: 44px 20px 32px; } .form-hero h1 { font-size: 22px; } .form-body, .hse-body { padding: 20px; } .checkbox-wrap { margin: 16px 16px 20px; } .hse-footer { padding: 0 16px 20px; } .success-wrap { padding: 40px 20px 28px; } .success-title { font-size: 20px; } }
  </style>
</head>
<body>
  <div class="spinner-overlay" id="spinner">
    <div class="spinner"></div>
    <div class="spinner-text" id="spinnerText">Сохранение...</div>
  </div>

  <div class="app-wrapper">
    <div class="screen active" id="screenLang">
      <div class="flag-list" id="flagList"></div>
    </div>

    <div class="screen" id="screenForm">
      <div class="soft-card">
        <div class="form-hero">
          <h1 id="formTitle">Регистрация посетителя</h1>
          <p id="formSubtitle">Заполните все поля</p>
        </div>
        <div class="form-body">
          <form id="visitorForm">
            <div class="form-group">
              <label for="firstName" id="lblFirstName">Имя</label>
              <input type="text" id="firstName" autocomplete="off">
              <div class="error-msg" id="errFirstName"></div>
            </div>
            <div class="form-group">
              <label for="lastName" id="lblLastName">Фамилия</label>
              <input type="text" id="lastName" autocomplete="off">
              <div class="error-msg" id="errLastName"></div>
            </div>
            <div class="form-group">
              <label for="company" id="lblCompany">Компания</label>
              <input type="text" id="company" autocomplete="off">
              <div class="error-msg" id="errCompany"></div>
            </div>
            <div class="form-group">
              <label for="department" id="lblDepartment">К какому департаменту пришёл посетитель</label>
              <input type="text" id="department" autocomplete="off">
              <div class="error-msg" id="errDepartment"></div>
            </div>
            <button type="button" class="btn btn-primary" id="btnContinue" onclick="goToHSE()">Продолжить</button>
            <a class="back-link" onclick="showScreen('screenLang')" id="btnBackLang">← Назад к выбору языка</a>
          </form>
        </div>
      </div>
    </div>

    <div class="screen" id="screenHSE">
      <div class="soft-card">
        <div class="hse-header">
          <h1 id="hseTitle">Инструктаж по безопасности</h1>
          <p id="hseSubtitle">Ознакомьтесь с правилами перед входом</p>
        </div>
        <div class="hse-body" id="hseContent"></div>
        <div class="checkbox-wrap">
          <input type="checkbox" id="hseCheck" onchange="toggleConfirm()">
          <label for="hseCheck" id="lblHseCheck">Я ознакомлен(а) с правилами безопасности и обязуюсь их соблюдать</label>
        </div>
        <div class="hse-footer">
          <button class="btn btn-success" id="btnConfirm" disabled onclick="submitData()">Подтвердить регистрацию</button>
          <a class="back-link" onclick="showScreen('screenForm')" id="btnBackForm">← Назад к форме</a>
        </div>
      </div>
    </div>

    <div class="screen" id="screenSuccess">
      <div class="soft-card">
        <div class="success-wrap">
          <div class="success-ring">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </div>
          <div class="success-title" id="successTitle">Регистрация завершена!</div>
        </div>
        <div class="success-footer">
          <button class="btn btn-primary" onclick="resetAll()" id="btnNewReg">Новая регистрация</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const CONFIG = {
      languages: [
        {code: 'az', name: 'Azərbaycan', flag: 'https://flagcdn.com/w640/az.png', instructions: ['assets/instructions/az/01-scan.jpg','assets/instructions/az/02-registration.jpg','assets/instructions/az/03-check.jpg','assets/instructions/az/04-badge.jpg','assets/instructions/az/05-safety.jpg','assets/instructions/az/06-wear.jpg','assets/instructions/az/07-rules.jpg','assets/instructions/az/08-fire.jpg','assets/instructions/az/09-help.jpg','assets/instructions/az/10-thanks.jpg']},
        {code: 'tr', name: 'Türkçe', flag: 'https://flagcdn.com/w640/tr.png', instructions: ['assets/instructions/tr/01-scan.jpg','assets/instructions/tr/02-registration.jpg','assets/instructions/tr/03-check.jpg','assets/instructions/tr/04-badge.jpg','assets/instructions/tr/05-safety.jpg','assets/instructions/tr/06-wear.jpg','assets/instructions/tr/07-rules.jpg','assets/instructions/tr/08-fire.jpg','assets/instructions/tr/09-help.jpg','assets/instructions/tr/10-thanks.jpg']},
        {code: 'ru', name: 'Русский', flag: 'https://flagcdn.com/w640/ru.png', instructions: ['assets/instructions/ru/01-scan.jpg','assets/instructions/ru/02-registration.jpg','assets/instructions/ru/03-check.jpg','assets/instructions/ru/04-badge.jpg','assets/instructions/ru/05-safety.jpg','assets/instructions/ru/06-wear.jpg','assets/instructions/ru/07-rules.jpg','assets/instructions/ru/08-fire.jpg','assets/instructions/ru/09-help.jpg','assets/instructions/ru/10-thanks.jpg']},
        {code: 'en', name: 'English', flag: 'https://flagcdn.com/w640/gb.png', instructions: ['assets/instructions/en/01-scan.jpg','assets/instructions/en/02-registration.jpg','assets/instructions/en/03-check.jpg','assets/instructions/en/04-badge.jpg','assets/instructions/en/05-safety.jpg','assets/instructions/en/06-wear.jpg','assets/instructions/en/07-rules.jpg','assets/instructions/en/08-fire.jpg','assets/instructions/en/09-help.jpg','assets/instructions/en/10-thanks.jpg']},
      ],
      api: {
        googleScriptUrl: 'https://script.google.com/macros/s/AKfycbzSrlWx8yCNyv3PJAyydBuiba9-3lnnxVPO7J2zI_ViVlmb54W2FyH_lIvQRzd5gJvzjg/exec',
        recaptchaSiteKey: '6LckpeUtAAAAAGFdoh8QtC5r9aJZHG9qSscasAk4'
      }
    };

    const i18n = {
      AZ: {formTitle:'Ziyarətçi qeydiyyatı', formSubtitle:'Bütün sahələri doldurun', lblFirstName:'Ad', lblLastName:'Soyad', lblCompany:'Şirkət', lblDepartment:'Hansı departamentə gəldiniz?', btnContinue:'Davam et', btnBackLang:'← Dil seçiminə qayıt', hseTitle:'Təhlükəsizlik Briefinqi', hseSubtitle:'Daxil olmadan əvvəl qaydaları oxuyun', lblHseCheck:'Təhlükəsizlik qaydaları ilə tanış oldum və onlara riayət edəcəyəm', btnConfirm:'Qeydiyyatı Təsdiqlə', btnBackForm:'← Forma Qayıt', successTitle:'Qeydiyyat Tamamlandı!', errRequired:'Bu sahə tələb olunur', errMinLength:'Ən az 2 simvol daxil edin'},
      TR: {formTitle:'Ziyaretçi Kaydı', formSubtitle:'Tüm alanları doldurun', lblFirstName:'Ad', lblLastName:'Soyad', lblCompany:'Şirket', lblDepartment:'Hangi departmana geldiniz?', btnContinue:'Devam Et', btnBackLang:'← Dil Seçimine Dön', hseTitle:'Güvenlik Briefingi', hseSubtitle:'Girmeden önce kuralları okuyun', lblHseCheck:'Güvenlik kurallarını anladım ve bunlara uyacağım', btnConfirm:'Kaydı Onayla', btnBackForm:'← Forma Dön', successTitle:'Kayıt Tamamlandı!', errRequired:'Bu alan zorunludur', errMinLength:'En az 2 karakter girin'},
      RU: {formTitle:'Регистрация посетителя', formSubtitle:'Заполните все поля', lblFirstName:'Имя', lblLastName:'Фамилия', lblCompany:'Компания', lblDepartment:'К какому департаменту пришёл посетитель', btnContinue:'Продолжить', btnBackLang:'← Назад к выбору языка', hseTitle:'Инструктаж по безопасности', hseSubtitle:'Ознакомьтесь с правилами перед входом', lblHseCheck:'Я ознакомлен(а) с правилами безопасности и обязуюсь их соблюдать', btnConfirm:'Подтвердить регистрацию', btnBackForm:'← Назад к форме', successTitle:'Регистрация завершена!', errRequired:'Это поле обязательно', errMinLength:'Введите минимум 2 символа'},
      EN: {formTitle:'Visitor Registration', formSubtitle:'Please fill in all fields', lblFirstName:'First Name', lblLastName:'Last Name', lblCompany:'Company', lblDepartment:'Department being visited', btnContinue:'Continue', btnBackLang:'← Back to Language Selection', hseTitle:'Safety Briefing', hseSubtitle:'Review the rules before entry', lblHseCheck:'I have read and understood the safety rules and agree to comply', btnConfirm:'Confirm Registration', btnBackForm:'← Back to Form', successTitle:'Registration Complete!', errRequired:'This field is required', errMinLength:'Please enter at least 2 characters'},
    };

    let currentLang = 'RU';
    let currentLangConfig = null;
    let formData = {};

    function init() {
      const flagList = document.getElementById('flagList');
      flagList.innerHTML = '';
      CONFIG.languages.forEach(function(lang, idx) {
        const div = document.createElement('div');
        div.className = 'flag-item';
        div.style.animationDelay = (0.08 + idx * 0.1) + 's';
        div.onclick = function() { selectLang(lang.code.toUpperCase()); };
        div.innerHTML = '<img src="' + lang.flag + '" alt="' + lang.name + '" draggable="false">';
        flagList.appendChild(div);
      });
    }

    function selectLang(lang) {
      currentLang = lang;
      currentLangConfig = CONFIG.languages.find(function(l) { return l.code.toUpperCase() === lang; });
      applyLang();
      showScreen('screenForm');
    }

    function applyLang() {
      const t = i18n[currentLang];
      const ids = ['formTitle','formSubtitle','lblFirstName','lblLastName','lblCompany','lblDepartment','btnContinue','btnBackLang','hseTitle','hseSubtitle','lblHseCheck','btnConfirm','btnBackForm','successTitle','btnNewReg'];
      ids.forEach(function(id) {
        const el = document.getElementById(id);
        if (el) el.textContent = t[id];
      });
    }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
      const target = document.getElementById(id);
      if (target) target.classList.add('active');
      window.scrollTo(0, 0);
    }

    function showError(id, msg) {
      const el = document.getElementById(id);
      if (!el) return;
      el.classList.add('error');
      const err = document.getElementById('err' + id.charAt(0).toUpperCase() + id.slice(1));
      if (err) {
        err.textContent = msg;
        err.classList.add('visible');
      }
    }

    function clearErrors() {
      document.querySelectorAll('input').forEach(function(i) { i.classList.remove('error'); });
      document.querySelectorAll('.error-msg').forEach(function(e) { e.classList.remove('visible'); });
    }

    function goToHSE() {
      clearErrors();
      const t = i18n[currentLang];
      let valid = true;
      const firstName = document.getElementById('firstName').value.trim();
      const lastName = document.getElementById('lastName').value.trim();
      const company = document.getElementById('company').value.trim();
      const department = document.getElementById('department').value.trim();

      if (!firstName) { showError('firstName', t.errRequired); valid = false; }
      else if (firstName.length < 2) { showError('firstName', t.errMinLength); valid = false; }
      if (!lastName) { showError('lastName', t.errRequired); valid = false; }
      else if (lastName.length < 2) { showError('lastName', t.errMinLength); valid = false; }
      if (!company) { showError('company', t.errRequired); valid = false; }
      if (!department) { showError('department', t.errRequired); valid = false; }

      if (!valid) return;

      formData = { firstName, lastName, company, department, lang: currentLang };

      const hseContent = document.getElementById('hseContent');
      hseContent.innerHTML = '';
      if (currentLangConfig && currentLangConfig.instructions) {
        currentLangConfig.instructions.forEach(function(src, idx) {
          const card = document.createElement('div');
          card.className = 'hse-img-card';
          const num = idx + 1;
          const img = document.createElement('img');
          img.src = src;
          img.alt = 'HSE Step ' + num;
          img.onerror = function() {
            card.innerHTML = '<div class="hse-img-error">⚠️ Изображение не найдено<br><small>' + src + '</small></div>';
          };
          const badge = document.createElement('div');
          badge.className = 'hse-step-badge';
          badge.textContent = num + '/10';
          card.appendChild(badge);
          card.appendChild(img);
          hseContent.appendChild(card);
        });
      }

      document.getElementById('hseCheck').checked = false;
      toggleConfirm();
      showScreen('screenHSE');
    }

    function toggleConfirm() {
      document.getElementById('btnConfirm').disabled = !document.getElementById('hseCheck').checked;
    }

    function submitData() {
      const spinner = document.getElementById('spinner');
      spinner.classList.add('active');

      if (!window.grecaptcha) {
        spinner.classList.remove('active');
        alert('reCAPTCHA не загрузился. Обновите страницу.');
        return;
      }

      grecaptcha.ready(function() {
        grecaptcha.execute(CONFIG.api.recaptchaSiteKey, { action: 'submit' }).then(function(token) {
          const payload = {
            firstName: formData.firstName,
            lastName: formData.lastName,
            company: formData.company,
            department: formData.department,
            lang: formData.lang,
            secret: 'Pox6pedmtbH1LhMsuTqHq4VJU5HN5Mr6-yV2GLVoId2zIssiyCYUXg9OkJKRUstWzW7virRyL9ygctGdFEEHJA',
            recaptchaToken: token
          };

          console.log('Отправка:', payload);

          fetch(CONFIG.api.googleScriptUrl, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Accept': 'application/json, text/plain, */*'
            },
            body: JSON.stringify(payload)
          })
          .then(function(response) {
            return response.text().then(function(text) {
              console.log('HTTP:', response.status);
              console.log('Тело ответа:', text);
              try {
                return JSON.parse(text);
              } catch (e) {
                return { success: response.ok, raw: text };
              }
            });
          })
          .then(function(result) {
            console.log('Результат:', result);
            spinner.classList.remove('active');
            if (result && result.success === true) {
              showScreen('screenSuccess');
            } else {
              alert('Ошибка отправки данных.\n' + (result && result.message ? result.message : 'Проверьте Apps Script и права на таблицу.'));
            }
          })
          .catch(function(err) {
            spinner.classList.remove('active');
            console.error('Fetch error:', err);
            alert('Ошибка сети или Google Apps Script.\n' + (err && err.message ? err.message : 'Неизвестная ошибка'));
          });
        }).catch(function(err) {
          spinner.classList.remove('active');
          console.error('reCAPTCHA error:', err);
          alert('Ошибка reCAPTCHA. Обновите страницу.\n' + (err && err.message ? err.message : ''));
        });
      });
    }

    function resetAll() {
      document.getElementById('visitorForm').reset();
      document.getElementById('hseCheck').checked = false;
      toggleConfirm();
      clearErrors();
      showScreen('screenLang');
    }

    init();
  </script>
</body>
</html>
